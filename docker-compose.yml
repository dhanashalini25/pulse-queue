version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: node src/api/server.js
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DASHBOARD_USER=admin
      - DASHBOARD_PASSWORD=changeme
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=100
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: node src/worker/worker.js
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=5
      - JOB_DEFAULT_ATTEMPTS=3
      - JOB_BACKOFF_DELAY_MS=2000
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
